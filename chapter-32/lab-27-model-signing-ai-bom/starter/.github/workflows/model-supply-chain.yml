# LAB-27 — model supply chain (Chapter 32): train → AI-BOM → keyless signatures → verify at deployment.
# Pull requests run the pre-merge gate only; signing happens on main, never for untrusted PR code.
name: model-supply-chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_tamper:
        description: "Lab Step 7: alter the model in transit between build and deploy"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pre-merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1 PyYAML==6.0.3 "cyclonedx-python-lib[json-validation]==11.12.0"
      - name: Unit tests
        run: pytest -q tools/tests
      - name: Train, build the AI-BOM and apply the deployment policy (no signing on PRs)
        run: |
          python tools/train.py data/phishing-urls.csv artifacts
          python tools/make_aibom.py artifacts/model.json data/phishing-urls.csv artifacts/evaluation.json artifacts/ai-bom.cdx.json
          python tools/verify_deployment.py artifacts/model.json data/phishing-urls.csv artifacts/ai-bom.cdx.json policy/deployment-policy.yaml

  build-and-sign:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pre-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write          # keyless signing: short-lived certificate bound to this workflow's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3
      - name: Train and build the AI-BOM
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python tools/train.py data/phishing-urls.csv artifacts
          python tools/make_aibom.py artifacts/model.json data/phishing-urls.csv artifacts/evaluation.json artifacts/ai-bom.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the model and the AI-BOM (keyless, bundles recorded in Rekor)
        run: |
          cosign sign-blob --yes --bundle artifacts/model.sigstore.json artifacts/model.json
          cosign sign-blob --yes --bundle artifacts/ai-bom.sigstore.json artifacts/ai-bom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-release
          path: artifacts/

  deploy-verify:
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model-release
          path: artifacts
      - name: "LAB STEP 7 ONLY: tamper with the model in transit"
        if: inputs.simulate_tamper
        run: |
          sed -i 's/"has_at_sign": 0\.[0-9]*/"has_at_sign": 0.0/' artifacts/model.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: "Stage 1: verify signatures and signer identity"
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/model-supply-chain.yml@refs/heads/main
        run: |
          verify() {
            cosign verify-blob --bundle "artifacts/$2" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "artifacts/$1"
          }
          verify model.json model.sigstore.json
          verify ai-bom.cdx.json ai-bom.sigstore.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3 "cyclonedx-python-lib[json-validation]==11.12.0"
      - name: "Stages 2–3: AI-BOM cross-reference and deployment policy"
        run: python tools/verify_deployment.py artifacts/model.json data/phishing-urls.csv artifacts/ai-bom.cdx.json policy/deployment-policy.yaml

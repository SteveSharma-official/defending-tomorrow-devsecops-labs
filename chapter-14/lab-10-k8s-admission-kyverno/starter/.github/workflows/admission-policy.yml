# LAB-10 — shift admission control left: evaluate Kubernetes manifests against the
# same Kyverno policies the cluster enforces, before anything is deployed.
name: admission-policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_VERSION: "1.15.2"
  KYVERNO_SHA256: "c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0"

jobs:
  kyverno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kyverno CLI (checksum verified)
        run: |
          curl -sSLo kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum --check --strict
          tar -xzf kyverno.tgz kyverno
      - name: Unit-test the policies
        run: ./kyverno test policy-tests
      - name: Evaluate every manifest in k8s/ (fails on any violation)
        run: ./kyverno apply policies/ --resource k8s/

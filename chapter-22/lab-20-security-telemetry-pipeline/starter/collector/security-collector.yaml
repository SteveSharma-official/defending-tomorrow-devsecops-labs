# Security-enriched OpenTelemetry Collector pipeline (Chapter 22, §22.4.2).
# Security attributes are added by the platform (processors), not by each application.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  k8sattributes:
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
  attributes/security:
    actions:
      - key: security.source_namespace
        from_attribute: k8s.namespace.name
        action: upsert
      - key: security.source_pod
        from_attribute: k8s.pod.name
        action: upsert
      - key: security.telemetry_source
        value: otel-collector-security-enriched
        action: upsert
  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  otlphttp:
    endpoint: https://security-data-plane.example.com:443
    headers:
      Authorization: "Bearer ${env:DATA_PLANE_TOKEN}"

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [k8sattributes, attributes/security, batch]
      exporters: [otlphttp]

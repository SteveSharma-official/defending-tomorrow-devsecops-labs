# LAB-10 — hardened Deployment for dt-orders-api (validated by policy; not applied unless you use the optional kind cluster)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-orders-api
  namespace: dt-lab
  labels:
    app.kubernetes.io/name: dt-orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dt-orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dt-orders-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/dt-orders-api:1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

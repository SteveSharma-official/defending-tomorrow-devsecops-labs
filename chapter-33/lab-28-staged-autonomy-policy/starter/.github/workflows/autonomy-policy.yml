# LAB-28 — Staged Autonomy Model as policy: compile strictly, unit-test with coverage, and replay recorded
# remediation requests whose expected decisions are part of the evidence (Chapter 33).
name: autonomy-policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.20.2"
      - name: Formatting and strict compilation
        run: |
          test -z "$(opa fmt --list policy)" || { echo "::error::Run 'opa fmt -w policy'"; exit 1; }
          opa check --strict policy data
      - name: Unit tests and invariants, with coverage threshold
        run: |
          opa test policy data -v
          opa test policy data --coverage --threshold 90
      - name: Replay recorded remediation requests against their expected decisions
        run: |
          fail=0
          for f in requests/*.json; do
            expected=$(opa eval -f raw -i "$f" 'input.expected_allow')
            actual=$(opa eval -f raw -d policy -d data -i "$f" 'data.remediation.decision.allow')
            echo "$f expected=${expected} actual=${actual}"
            if [ "$expected" != "$actual" ]; then
              echo "::error file=$f::decision changed: expected allow=${expected}, got ${actual}"
              opa eval -f pretty -d policy -d data -i "$f" 'data.remediation.decision.reasons'
              fail=1
            fi
          done
          exit $fail

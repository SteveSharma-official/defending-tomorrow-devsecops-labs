# LAB-06 — software composition analysis at two points:
#   1. dependency-review: blocks a PR that ADDS a vulnerable dependency (diff-aware, free on public repos)
#   2. pip-audit: audits the full resolved dependency set on every push/PR and weekly
name: sca

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"    # weekly: new CVEs appear in code that has not changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write     # allows the summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Audit resolved dependencies (fails on any known vulnerability)
        run: pip-audit -r app/requirements.txt --desc on

# LAB-11 — dynamic application security testing: run the application, then probe it
# with the OWASP ZAP baseline (passive) scan. Only ever scan targets you own.
name: dast

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Start the application under test (ephemeral, on the runner only)
        working-directory: app
        run: |
          pip install -r requirements.txt
          nohup gunicorn --bind 0.0.0.0:8080 --workers 2 app:app > ../app.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:8080/orders?customer=alice"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

# LAB-05 — static application security testing: CodeQL (semantic, data-flow) + Semgrep (fast, custom rules).
name: sast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: codeql-python

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.177.0
      - name: Test the custom rules first (a rule is code; it gets tests)
        run: semgrep --test --config .semgrep/dt-sql-injection.yml .semgrep/tests/dt-sql-injection.py --metrics=off
      - name: Semgrep with the repository's own rules (offline, no account needed)
        run: semgrep scan --config .semgrep/ --metrics=off --sarif --output semgrep.sarif app/ || true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Semgrep gate — fail on any ERROR-severity finding
        run: semgrep scan --config .semgrep/ --metrics=off --error --severity ERROR app/

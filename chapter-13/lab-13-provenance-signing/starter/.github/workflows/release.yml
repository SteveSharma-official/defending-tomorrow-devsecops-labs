# LAB-13 — build once, publish by digest, attest provenance, sign keylessly, verify before use.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-attest-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # OIDC token for Sigstore keyless signing + attestations
      attestations: write      # store the provenance attestation
      artifact-metadata: write # storage record (VERIFY CURRENT PRODUCT BEHAVIOUR)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable tag = commit SHA; no ':latest')
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          provenance: false   # provenance is produced by actions/attest below

      - name: Attest build provenance (SLSA provenance, Sigstore-signed)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless signature by digest (no key material on the runner)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  verify:
    needs: build-attest-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify provenance and signature exactly as a deployer would
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build-attest-sign.outputs.digest }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
          echo "Provenance and signature verified for ${IMAGE}@${DIGEST}"

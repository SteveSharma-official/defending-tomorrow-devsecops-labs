# LAB-01 — fail the build when the threat model has gaps.
name: threat-model-gate

on:
  pull_request:
    paths: ["threat-model/**", "tools/**", ".github/workflows/threat-model-gate.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3
      - name: Check threat model completeness
        run: python tools/check_threat_model.py threat-model/threat-model.yaml

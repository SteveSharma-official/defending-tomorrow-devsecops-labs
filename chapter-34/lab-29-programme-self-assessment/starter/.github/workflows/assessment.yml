# LAB-29 — programme maturity self-assessment as code (Chapter 34, Checklist 34.1). Claims need evidence,
# owners are people, and the workbook is regenerated from the data on every change.
name: assessment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Unit tests
        run: pytest -q tools/tests
      - name: Validate claims and build the workbook
        run: python tools/assess.py assessment/checklist-34.1.yaml assessment/self-assessment.yaml out
      - name: Publish the summary to the run page
        run: cat out/workbook.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maturity-workbook
          path: out/

# Synthetic "compromised" workload for the optional kind exercise. It only writes marker files —
# nothing malicious runs. The marker simulates a dropped payload the investigator must preserve.
apiVersion: v1
kind: Namespace
metadata:
  name: lab22
---
apiVersion: v1
kind: Pod
metadata:
  name: orders-api
  namespace: lab22
  labels: {app: orders-api}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - echo "$(date -u +%FT%TZ) GET /orders 200";
          echo '#!/bin/sh' > /tmp/x.sh; echo 'echo simulated-payload' >> /tmp/x.sh;
          echo "$(date -u +%FT%TZ) fetched /tmp/x.sh from 198.51.100.66 (simulated)";
          sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      resources:
        limits: {cpu: 100m, memory: 64Mi}

# Isolation step: deny all ingress and egress for any pod labelled quarantine=true (fully reversible).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarantine-deny-all
  namespace: lab22
spec:
  podSelector:
    matchLabels: {quarantine: "true"}
  policyTypes: [Ingress, Egress]

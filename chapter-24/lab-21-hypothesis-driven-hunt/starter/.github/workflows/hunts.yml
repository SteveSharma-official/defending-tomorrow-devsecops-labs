# LAB-21 — hunts as code: every hunt is a versioned hypothesis + query, tested against ground truth,
# and every confirmed hunt must feed a detection candidate that passes sigma check (Chapters 23–24).
name: hunts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install duckdb==1.5.6 pytest==9.1.1 PyYAML==6.0.3 sigma-cli==3.1.0
      - name: Ground-truth tests (each hunt finds the planted activity and nothing legitimate)
        run: pytest -v tools/tests
      - name: Run hunts and enforce the hunter-to-rule feedback loop
        run: python tools/run_hunts.py --report hunt-report.json
      - name: Detection candidates are valid Sigma
        run: sigma check detections/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hunt-report
          path: hunt-report.json

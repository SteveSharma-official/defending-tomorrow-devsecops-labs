title: Secret Read by IAM User from a Source IP Outside Its Allow-List
id: 9a3f1d52-6c1e-4b8e-9f0a-24a1b2c3d401
status: experimental
description: >
  Detection candidate from HUNT-CLOUD-001 (LAB-21). A CI access key read secrets from an IP that the key
  had never used. Single-event Sigma cannot express "first seen"; this rule encodes the known-good egress
  IPs for CI principals, and a correlation rule or SIEM analytic should cover the first-seen logic.
references:
  - https://github.com/SteveSharma-official/defending-tomorrow-devsecops-labs
author: Defending Tomorrow labs
date: 2026-10-01
tags:
  - attack.credential-access
  - attack.t1555.006
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: GetSecretValue
    userIdentity.type: IAMUser
    userIdentity.userName: ci-deployer
  filter_known_egress:
    sourceIPAddress: 192.0.2.20
  condition: selection and not filter_known_egress
falsepositives:
  - CI runner egress IP changed without updating this rule
level: high

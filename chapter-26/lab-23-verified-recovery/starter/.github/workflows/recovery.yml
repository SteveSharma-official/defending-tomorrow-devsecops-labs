# LAB-23 — verified recovery. The gate (every PR) tests target selection and the runbook order.
# The verify job (manual) proves the chosen digest's signature and provenance against your LAB-13 image.
name: recovery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: "Image repository from LAB-13, e.g. ghcr.io/<you>/dt-lab-13 (lower case)"
        required: true
      source_repo:
        description: "Repository that built it, e.g. <you>/dt-lab-13"
        required: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Runbook verifies before it deploys
        run: python tools/check_runbook.py recovery/recovery-runbook.yaml
      - name: Restore target satisfies the recovery policy
        run: python tools/select_recovery_target.py recovery/release-ledger.json recovery/incident.yaml recovery/recovery-policy.yaml
      - name: Unit tests
        run: pytest -q tools/tests

  verify-target:
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML==6.0.3
      - id: target
        name: Select the restore target
        run: python tools/select_recovery_target.py recovery/release-ledger.json recovery/incident.yaml recovery/recovery-policy.yaml
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signature (keyless, bound to the LAB-13 workflow identity)
        env:
          IMAGE: ${{ inputs.image }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${SOURCE_REPO}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for ${IMAGE}@${DIGEST}"
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${SOURCE_REPO}"
      - name: Restore decision
        env:
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: echo "::notice::Restore target approved — ${VERSION} (${DIGEST}). Deploy by digest, then run the health gate."

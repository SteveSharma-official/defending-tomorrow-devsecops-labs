# AWS-LAB-02 — gated Terraform delivery: plan → scan → policy → human approval → apply,
# plus a scheduled drift check. Credentials come only from GitHub OIDC.
name: terraform

on:
  pull_request:
    paths: ["infra/**", "policy/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "policy/**", ".github/workflows/terraform.yml"]
  schedule:
    - cron: "0 */6 * * *"          # drift detection every 6 hours
  workflow_dispatch:

permissions: {}

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_bucket_name: ${{ vars.EVIDENCE_BUCKET_NAME }}
  CONFTEST_VERSION: "0.62.0"
  CONFTEST_SHA256: "284231908e4cf66d156e5577c3eee2f67d9f2edf2521fa2309e0df1969f871e5"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"
      - run: terraform fmt -check && terraform validate
      - name: Plan (exit code 2 = changes present — used for drift detection)
        id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tf.plan
          code=$?
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]
      - run: terraform show -json tf.plan > plan.json
      - name: Checkov on the plan (resolved values, not just source)
        run: pip install checkov==3.3.19 && checkov -f plan.json --framework terraform_plan --compact
      - name: Conftest organisational policy on the plan (LAB-08 policies)
        run: |
          curl -sSLo conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum --check --strict
          tar -xzf conftest.tgz conftest
          ./conftest test plan.json --policy ../policy
      - name: Drift alarm on scheduled runs
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::DRIFT DETECTED — live infrastructure differs from main. Investigate before re-applying."
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/tf.plan
          retention-days: 3

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-sandbox          # required reviewer; OIDC sub becomes repo:<o>/<r>:environment:aws-sandbox
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ github.run_id }}
          path: infra
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"
      - name: Apply exactly the reviewed plan
        run: terraform apply -input=false tf.plan

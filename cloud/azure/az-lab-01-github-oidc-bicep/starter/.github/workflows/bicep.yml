# AZ-LAB-01 — Bicep: scan on every change; what-if + deploy to Azure through OIDC and an approved environment.
name: bicep

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/bicep.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/bicep.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and lint Bicep (Azure CLI is preinstalled on GitHub-hosted Ubuntu runners)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Checkov (Bicep)
        run: pip install checkov==3.3.19 && checkov -d infra --framework bicep --compact

  deploy:
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-sandbox        # federated credential subject: repo:<owner>/<repo>:environment:azure-sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Azure login with OIDC (no client secret exists)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (the change preview that reviewers approve)
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          SUFFIX: ${{ vars.LAB_SUFFIX }}
        run: az deployment group what-if -g "$RG" -f infra/main.bicep -p suffix="$SUFFIX"
      - name: Deploy
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          SUFFIX: ${{ vars.LAB_SUFFIX }}
        run: az deployment group create -g "$RG" -f infra/main.bicep -p suffix="$SUFFIX" --query properties.outputs

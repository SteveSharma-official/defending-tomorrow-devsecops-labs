# LAB-19 — measure LLM guardrail quality on every change: detection rate and false-positive
# rate against a versioned attack/benign corpus. No model or API key is used.
name: guardrails

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Guardrail regression suite
        run: pytest -v tests
